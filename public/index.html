<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Music Player for MPD</title>

    <!-- Styles: tokens → base → layout → components → animations → responsive -->
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/animations.css">
    <link rel="stylesheet" href="styles/responsive.css">

    <!-- App entry (ES module) -->
    <script type="module" src="src/main.js" defer></script>
  </head>
  <body>
    <div class="app">
      <!-- Top bar: brand, search, connection status -->
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" data-icon="music" aria-hidden="true"></span>
          <span class="brand-name">MPD<span class="brand-caption">Music, simply.</span></span>
        </div>

        <div class="search" id="searchWrap">
          <span class="search-icon" data-icon="search" aria-hidden="true"></span>
          <input
            type="search"
            class="search-input"
            id="searchInput"
            placeholder="Search tracks, artists, albums…"
            aria-label="Search library"
            autocomplete="off"
            spellcheck="false"
          >
          <ul class="search-results" id="searchResults" aria-label="Search results" hidden></ul>
        </div>

        <div class="topbar-right">
          <div class="status" title="MPD connection status" id="status" role="status">
            <span class="status-dot" data-state="disconnected"></span>
            <span class="status-label">Disconnected</span>
          </div>
        </div>
      </header>

      <!-- Main layout: sidebar + content -->
      <main class="layout">
        <aside class="sidebar" aria-label="Library navigation">
          <div class="nav-caption">Your music</div>
          <nav>
            <ul class="nav-list" id="navList">
              <li><a href="#now-playing" class="nav-item is-active" data-view="now-playing" title="Now Playing" aria-label="Now Playing"><span class="nav-icon" data-icon="music" aria-hidden="true"></span><span class="nav-label">Now Playing</span></a></li>
              <li><a href="#queue"        class="nav-item"           data-view="queue" title="Queue" aria-label="Queue"><span class="nav-icon" data-icon="queue" aria-hidden="true"></span><span class="nav-label">Queue</span></a></li>
              <li><a href="#library"      class="nav-item"           data-view="library" title="Library" aria-label="Library"><span class="nav-icon" data-icon="library" aria-hidden="true"></span><span class="nav-label">Library</span></a></li>
              <li><a href="#playlists"    class="nav-item"           data-view="playlists" title="Playlists" aria-label="Playlists"><span class="nav-icon" data-icon="playlists" aria-hidden="true"></span><span class="nav-label">Playlists</span></a></li>
              <li><a href="#artists"      class="nav-item"           data-view="artists" title="Artists" aria-label="Artists"><span class="nav-icon" data-icon="artists" aria-hidden="true"></span><span class="nav-label">Artists</span></a></li>
              <li><a href="#albums"       class="nav-item"           data-view="albums" title="Albums" aria-label="Albums"><span class="nav-icon" data-icon="albums" aria-hidden="true"></span><span class="nav-label">Albums</span></a></li>
              <li><a href="#files"        class="nav-item"           data-view="files" title="Files" aria-label="Files"><span class="nav-icon" data-icon="files" aria-hidden="true"></span><span class="nav-label">Files</span></a></li>
            </ul>
          </nav>

          <div class="sidebar-footer">
            <div class="lib-stats muted" id="libStats">— tracks</div>
            <div class="sidebar-note">Made for listening.</div>
          </div>
        </aside>

        <section class="content" aria-label="Main view" tabindex="-1" id="view">
          <header class="content-header">
            <h2 class="view-title" id="viewTitle">Now Playing</h2>
            <div class="content-actions" id="viewActions"></div>
          </header>

          <div class="view-body" id="viewBody"></div>
        </section>
      </main>

      <!-- Footer: now playing + transport controls -->
      <footer class="player" aria-label="Player controls">
        <div class="now-playing">
          <a href="#now-playing" class="artwork artwork-sm" id="artworkSm" aria-label="Open now playing">
            <span class="artwork-glyph">♪</span>
          </a>
          <div class="now-playing-meta">
            <div class="now-playing-title" id="nowTitle">Nothing playing</div>
            <div class="now-playing-artist" id="nowArtist">—</div>
          </div>
        </div>

        <div class="transport">
          <div class="transport-buttons">
            <button class="ctrl" type="button" title="Shuffle (S)" aria-label="Shuffle" id="shuffleBtn" data-icon="shuffle"></button>
            <button class="ctrl" type="button" title="Previous (←)" aria-label="Previous" id="prevBtn" data-icon="previous"></button>
            <button class="ctrl ctrl-play" type="button" title="Play / Pause (Space)" aria-label="Play / Pause" id="playBtn" data-icon="play"></button>
            <button class="ctrl" type="button" title="Next (→)" aria-label="Next" id="nextBtn" data-icon="next"></button>
            <button class="ctrl" type="button" title="Repeat (R)" aria-label="Repeat" id="repeatBtn" data-icon="repeat"></button>
          </div>
          <div class="progress" role="group" aria-label="Playback progress">
            <span class="time time-current" id="timeCurrent">0:00</span>
            <div class="progress-track" id="progressTrack" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
              <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
              <div class="progress-thumb" id="progressThumb" style="left: 0%;"></div>
            </div>
            <span class="time time-total" id="timeTotal">0:00</span>
          </div>
        </div>

        <div class="extras">
          <button class="ctrl ctrl-small" type="button" title="Mute (M)" aria-label="Mute" id="muteBtn" data-icon="volume"></button>
          <input
            type="range"
            class="volume"
            id="volume"
            min="0"
            max="100"
            value="70"
            aria-label="Volume"
          >
        </div>
      </footer>
    </div>

    <!-- Toast notifications -->
    <div class="toast-stack" id="toasts" aria-live="polite"></div>

  </body>
</html>
